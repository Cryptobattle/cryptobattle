limit_req_zone $binary_remote_addr zone=operator_api:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/operator-api.conf;

  location = /health {
    default_type application/json;
    return 200 '{"ok":true}';
  }
  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /api/ {
    return 404;
  }
  location / {
    try_files $uri /index.html;
  }
}
